name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd zappy_server
          npm install

      - name: Restart PM2
        run: |
          pm2 restart zappy-server