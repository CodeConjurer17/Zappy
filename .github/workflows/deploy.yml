name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd ~/apps/zappy
          git fetch origin
          git reset --hard origin/main
          git clean -fd --exclude=zappy_server/.env

      - name: Install dependencies
        run: |
          cd ~/apps/zappy/zappy_server
          npm install

      - name: Restart PM2
        run: |
          pm2 restart zappy-server